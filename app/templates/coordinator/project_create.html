{% extends "base.html" %}

{% block title %}Новый волонтёрский проект · ДоброДело{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-10">
    <div class="mb-4">
        <a href="{{ url_for('coordinator.dashboard') }}" class="text-xs text-slate-500 hover:text-slate-800">
            <i class="fa-solid fa-arrow-left"></i> Назад в панель управления
        </a>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Создание волонтёрского проекта</h1>
            <p class="text-xs text-slate-500 mt-1">Заполните базовую информацию о вашей инициативе</p>
        </div>

        <form method="POST" action="{{ url_for('coordinator.create_project') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Название проекта (FR-06)</label>
                <input type="text" name="title" required placeholder="Например: Выгул и социализация собак в приюте"
                       class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Направление / Категория</label>
                <select name="category" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 bg-white">
                    {% for cat in categories %}
                        <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Город проведения</label>
                    <input type="text" name="city" value="{{ org.city if org else 'Москва' }}" required
                           class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Точный адрес / место сбора</label>
                    <input type="text" name="address" placeholder="ул. Парковая, д. 12"
                           class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Описание проекта и задачи волонтёров</label>
                <textarea name="description" rows="5" required placeholder="Расскажите, кому вы помогаете, что предстоит делать волонтёрам, какую экипировку взять..."
                          class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
            </div>

            <div class="pt-4 flex justify-end gap-3">
                <a href="{{ url_for('coordinator.dashboard') }}" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition">
                    Отмена
                </a>
                <button type="submit" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl text-sm shadow-sm transition">
                    Создать проект и перейти к сменам
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
