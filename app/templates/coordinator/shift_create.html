{% extends "base.html" %}

{% block title %}Новая смена · {{ project.title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-10">
    <div class="mb-4">
        <a href="{{ url_for('coordinator.dashboard') }}" class="text-xs text-slate-500 hover:text-slate-800">
            <i class="fa-solid fa-arrow-left"></i> Назад к списку проектов
        </a>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
        <div class="mb-6">
            <span class="text-xs font-bold text-brand-600 uppercase tracking-wider">Проект: {{ project.title }}</span>
            <h1 class="text-2xl font-bold text-slate-900 mt-1">Добавление волонтёрской смены</h1>
            <p class="text-xs text-slate-500 mt-1">Укажите дату, время и количество необходимых волонтёров</p>
        </div>

        <form method="POST" action="{{ url_for('coordinator.create_shift', project_id=project.id) }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Дата смены</label>
                <input type="date" name="date" required
                       class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Время начала</label>
                    <input type="time" name="start_time" value="10:00" required
                           class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Время окончания</label>
                    <input type="time" name="end_time" value="14:00" required
                           class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Мест (волонтёров)</label>
                    <input type="number" name="max_volunteers" value="10" min="1" max="500" required
                           class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Часов в зачёт (FR-28)</label>
                    <input type="number" step="0.5" name="hours" value="4.0" min="0.5" required
                           class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Мин. возраст (лет)</label>
                    <input type="number" name="min_age" value="14" min="12" max="65" required
                           class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Место сбора / локация</label>
                <input type="text" name="location" value="{{ project.address or '' }}" placeholder="Например: Главный вход приюта"
                       class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div class="pt-4 flex justify-end gap-3">
                <a href="{{ url_for('coordinator.dashboard') }}" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition">
                    Отмена
                </a>
                <button type="submit" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl text-sm shadow-sm transition">
                    Опубликовать смену
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
