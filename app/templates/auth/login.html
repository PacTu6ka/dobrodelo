{% extends "base.html" %}

{% block title %}Вход в систему · ДоброДело{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Вход в «ДоброДело»</h1>
            <p class="text-xs text-slate-500 mt-1">Войдите как волонтёр или представитель организации</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Электронная почта</label>
                <input type="email" name="email" required placeholder="user@example.com"
                       class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Пароль</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl text-sm shadow-sm transition">
                Войти в систему
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-500">
            Нет аккаунта? <a href="{{ url_for('auth.register') }}" class="text-brand-600 font-semibold hover:underline">Зарегистрироваться</a>
        </div>
    </div>
</div>
{% endblock %}
