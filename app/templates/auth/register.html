{% extends "base.html" %}

{% block title %}Регистрация · ДоброДело{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-12">
    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Регистрация в сервисе</h1>
            <p class="text-xs text-slate-500 mt-1">Присоединяйтесь к сообществу добрых дел</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
            <!-- Выбор роли (FR-01, FR-03) -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-2">Ваша роль</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-slate-50 transition border-slate-200">
                        <input type="radio" name="role" value="volunteer" checked class="text-brand-600 focus:ring-brand-500" onchange="toggleOrgField(false)">
                        <div>
                            <div class="text-xs font-bold text-slate-800">Волонтёр</div>
                            <div class="text-[10px] text-slate-500">Помощь проектам</div>
                        </div>
                    </label>
                    <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-slate-50 transition border-slate-200">
                        <input type="radio" name="role" value="coordinator" class="text-brand-600 focus:ring-brand-500" onchange="toggleOrgField(true)">
                        <div>
                            <div class="text-xs font-bold text-slate-800">Организация (НКО)</div>
                            <div class="text-[10px] text-slate-500">Набор волонтёров</div>
                        </div>
                    </label>
                </div>
            </div>

            <div id="org_field" class="hidden">
                <label class="block text-xs font-semibold text-slate-700 mb-1">Название организации / фонда</label>
                <input type="text" name="org_name" placeholder="Приют «Верный друг», ЭкоДвижение..."
                       class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">ФИО / Контактное лицо</label>
                <input type="text" name="full_name" required placeholder="Иванов Иван Иванович"
                       class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Город</label>
                    <input type="text" name="city" value="Москва" required
                           class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Дата рождения (для учета 152-ФЗ)</label>
                    <input type="date" name="birth_date" required
                           class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Электронная почта</label>
                    <input type="email" name="email" required placeholder="name@domain.ru"
                           class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Телефон</label>
                    <input type="tel" name="phone" placeholder="+7 (999) 000-00-00"
                           class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Пароль</label>
                <input type="password" name="password" required placeholder="Минимум 6 символов"
                       class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div class="text-[11px] text-slate-500">
                Нажимая «Зарегистрироваться», вы подтверждаете согласие на обработку персональных данных в соответствии с 152-ФЗ.
            </div>

            <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl text-sm shadow-sm transition">
                Зарегистрироваться
            </button>
        </form>
    </div>
</div>

<script>
function toggleOrgField(show) {
    const el = document.getElementById('org_field');
    if (show) {
        el.classList.remove('hidden');
    } else {
        el.classList.add('hidden');
    }
}
</script>
{% endblock %}
